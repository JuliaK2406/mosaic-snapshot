results:
  F:
    headline: "Your focus: your Foundation"
    what_it_means: >-
      Right now, you're giving more than you're getting back. It may feel like
      running slightly on reserve: rest that doesn't quite restore you, and time
      for yourself that keeps moving to next week.
    how_it_affects:
      - >-
        Everything else in your mosaic rests on this. When your reserves are low,
        even the things you're good at take more effort.
      - >-
        Decisions feel heavier, ambition can start to feel like pressure, and it's
        harder to be fully present in the moments that matter most. It means your
        foundation needs some of the attention you give everyone else.
    steps:
      - >-
        Choose one moment this week that is just for recovery, and keep it the way
        you'd keep a meeting with someone important.
      - >-
        Look back at last week. Notice what gave you energy and what drained you.
        If you can, let go of one thing that took more than it gave.
      - >-
        Pick one task you can stop doing or hand over this month.
    cta_question: "Curious how to rebuild your foundation without slowing down your career?"

  P:
    headline: "Your focus: your Professional Fulfilment"
    what_it_means: >-
      You're doing good work, and you know it. But the work itself isn't giving you
      enough in return right now: a clear sense of direction, the feeling that it
      matters, or the security you've earned.
    how_it_affects:
      - >-
        When the path ahead isn't clear, a lot of energy quietly goes into wondering
        and weighing options. It also makes it harder to ask for what you want, or to
        show up visibly, because you're not yet sure what you're asking for. Once your
        direction is clear, both become easier: your energy has a focus, and your ask
        has a shape.
    steps:
      - >-
        In a few sentences, describe what you'd like your work to look like in
        2–3 years. And how would you want to feel?
      - >-
        Think of three moments this year when your work felt truly worthwhile.
        What do they have in common?
      - >-
        Give financial security a number. What does "enough" look like for you,
        concretely?
    cta_question: "Want to see your next move from a bird's-eye view, with a plan to get there?"

  V:
    headline: "Your focus: your Visibility"
    what_it_means: >-
      The people who work closely with you know how good you are. The challenge is
      that the people who make decisions may not see the full picture, and asking
      for what you've earned may not come naturally to you.
    how_it_affects:
      - >-
        Many capable leaders expect good work to speak for itself. Often, it doesn't.
        Opportunities, promotions and recognition tend to go to the people who are
        visible, not only to those who deliver. Over time, not being seen can quietly
        wear down your energy, and even make you doubt a direction you were once
        sure of.
    steps:
      - >-
        Share one result with someone whose opinion shapes your next step. Talk about
        the difference it made, not only the work behind it.
      - >-
        Prepare one ask: a project, a raise, a seat at the table. Write it down and
        consider scheduling a conversation.
      - >-
        Say yes to one visible moment this month: a panel, a post, or presenting your
        team's work yourself.
    cta_question: "Want to see how to be recognised for the leader you already are, without feeling like you're bragging?"

  balanced:
    headline: "Your mosaic is in good balance"
    what_it_means: >-
      Right now, no area of your life is pulling the others down. That's less common
      than it sounds, and it usually means you've made some careful choices along
      the way.
    whats_next:
      - >-
        A balanced mosaic is a good moment to ask a different question: not what needs
        fixing, but what you'd like to grow into next.
      - >-
        A bigger role, a venture of your own, or simply more of what already works?
        Balance is easier to keep when you know where you're heading.
    steps:
      - >-
        Notice which of your scores feels most alive right now. It's often a clue to
        what you'd like more of.
      - >-
        Write down one ambition you've been saving for "the right time." Then ask
        yourself what the right time would actually look like.
      - >-
        Name one habit or boundary that keeps your mosaic in balance, and protect it.
    cta_question: "Curious what your next chapter could look like?"

