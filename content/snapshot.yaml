  wordmark: "MOSAIC OF LIFE SNAPSHOT"
  headline: "Which part of your life needs you first?"
  subhead: "A two-minute self-assessment for ambitious women leaders juggling work, personal priorities and their next ambitions"
  discover_title: "You'll discover:"   # the block under the mosaic (on a laptop under the subhead)
  discover_items:
    - "Your personal Life Mosaic results across Life Foundation, Professional Fulfilment and Visibility"
    - "Which area needs your attention most to support your next ambition"
    - "Three practical first steps you can take to move forward"
  meta_line: "12 questions · 2 minutes · free"   # right above the Start button
  start_label: "Start"
  author_line: "Created by Julia Krylova, strategic mentor for women leaders, based on her Mosaic of Life Method™."

question:
  back_label: "Back"
  next_label: "Next"
  scale:
    - { value: 1, label: "disagree" }
    - { value: 5, label: "partially agree" }
    - { value: 10, label: "completely agree" }

# Three pillars with four items each. Every item has a title and a note: the statement shown
# under the title, above the buttons 1 to 10 (1 = disagree, 10 = completely agree).
pillars:
  - key: F
    name: "Foundation: Life Resilience"
    short: "Foundation"
    in_text: "Foundation"
    items:
      - title: "Energy & recovery"
        note: "I have enough energy for my day, and rest actually helps me recharge."
      - title: "Emotional resilience under pressure"
        note: "When pressure builds, I easily regain my balance."
      - title: "My calendar reflects my priorities"
        note: "The way I spend my week matches what matters most to me."
      - title: "Time for myself: rest and space, without guilt"
        note: "I have time that's just mine, without feeling I should be doing something else."
  - key: P
    name: "Professional Fulfilment"
    short: "Professional"
    in_text: "Professional Fulfilment"
    items:
      - title: "Satisfaction with my current role"
        note: "My current role makes good use of my strengths and keeps me engaged."
      - title: "Clarity on my next career move (2–3 years)"
        note: "I know where I want to go professionally and what it will take to get there."
      - title: "Financial independence & security"
        note: "I feel secure about my finances, both now and in the future."
      - title: "Meaning & impact of my work"
        note: "My work feels meaningful, and I can see the difference I'm making."
  - key: V
    name: "Visibility, Presence, Status"
    short: "Visibility"
    in_text: "Visibility"
    items:
      - title: "Executive presence"
        note: "I feel confident and credible in meetings, presentations and difficult conversations."
      - title: "Advocating for myself"
        note: "I'm comfortable asking for what I deserve: promotion, pay, resources, credit."
      - title: "External visibility"
        note: "I'm visible beyond my own team or company."
      - title: "Thought leadership"
        note: "My ideas influence important conversations and decisions."

grow_question:   # question 13. Title from Julia (15 Oct); the three option labels are a draft, waiting for her OK
  eyebrow: "YOUR PRIORITY"
  title: "Which area has your priority right now?"
  subtitle: "Choose one."
  options:
