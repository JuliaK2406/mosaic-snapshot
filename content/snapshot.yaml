# Mosaic of Life Snapshot: all text of the page lives in this file.
# Edit the text after the colons. Keep field names and indentation as they are.

meta:
  published: false   # false = hidden from search engines and the sample link is visible. Set true on launch day
  site_url: https://mosaic.juliakrylova.com
  title: "Mosaic of Life Snapshot | Julia Krylova"
  description: "A two-minute self-assessment across the three pillars of the Mosaic of Life: your foundation, your professional path and your visibility."

links:
  calendly: https://calendly.com/juliakrylova/30min
  main_site: https://www.juliakrylova.com

backend:
  endpoint_url: ""   # filled in at stage 2. Empty = nothing is sent anywhere

logic:
  balanced_gap: 3        # gap = 10 minus a pillar average. Balanced when every gap is below this number
  tie_order: [F, P, V]   # which pillar comes first when two averages are equal

intro:
  wordmark: "MOSAIC OF LIFE SNAPSHOT"
  headline: "Which part of your life needs you first?"
  subhead: "A two-minute self-assessment across the three pillars of the Mosaic of Life: your foundation, your professional path and your visibility."
  meta_line: "13 questions · 2 minutes · free"
  start_label: "Start"
  author_line: "Created by Julia Krylova, strategic mentor for women leaders, based on her Mosaic of Life Method™."
  sample_label: "See a sample result"   # shown only while meta.published is false

question:
  prompt: "Where are you today?"
  back_label: "Back"
  scale:
    - { value: 1, label: "a constant struggle" }
    - { value: 5, label: "OK, but not thriving" }
    - { value: 10, label: "strong, it fuels me" }

pillars:
  - key: F
    name: "Foundation: Life Resilience"
    short: "Foundation"
    in_text: "Foundation"
    items:
      - title: "Energy & recovery"
      - title: "Emotional resilience under pressure"
      - title: "My calendar reflects my priorities"
      - title: "Time for myself"
        note: "Rest and space, without guilt"
  - key: P
    name: "Professional Fulfilment"
    short: "Professional"
    in_text: "Professional Fulfilment"
    items:
      - title: "Satisfaction with my current role"
      - title: "Clarity on my next career move"
        note: "In the next 2-3 years"
      - title: "Financial independence & security"
      - title: "Meaning & impact of my work"
  - key: V
    name: "Visibility, Presence, Status"
    short: "Visibility"
    in_text: "Visibility"
    items:
      - title: "Executive presence"
        note: "I am calm, grounded, warm yet come across as authoritative"
      - title: "Advocating for myself"
        note: "Asking for promotion, pay, resources, credit"
      - title: "External visibility"
        note: "I'm comfortable being seen and expressing myself publicly: industry events, panels, LinkedIn"
      - title: "Thought leadership"
        note: "My ideas shape decisions"

grow_question:   # question 13. Draft wording, waiting for Julia's OK
  eyebrow: "YOUR PRIORITY"
  title: "Which area would you most like to grow right now?"
  subtitle: "Choose one."
  options:
