# Builds the page and publishes dist/ to GitHub Pages.
# Runs on every push to main and by hand (Actions -> Deploy -> Run workflow).
# Playwright is a devDependency and is not installed here: tests use node:test only.
# Action versions follow GitHub's own Pages starter workflow (deploy-pages v5,
# upload-pages-artifact v3) plus the current majors of checkout and setup-node.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
